<!-- Título: la clase .titulo (pages/_home.scss) lo pone rojo, en mayúsculas y centrado -->
<h1 class="titulo">Mi título</h1>

<!-- Botón: el contenedor lo alinea a la derecha (flex-end) y .boton-azul lo pinta de azul -->
<div class="contenedor-boton">
  <ion-button class="boton-azul">Aceptar</ion-button>
</div>

<!-- Imagen: el contenedor la centra y .imagen le da el borde verde de 3px -->
<div class="contenedor-imagen">
  <img class="imagen" src="assets/icon/favicon.png" alt="Imagen de ejemplo" />
</div>


<!-- (click) ejecuta cambiarImagen() del componente al pulsar -->
<ion-button class="boton-azul" (click)="cambiarImagen()">Aceptar</ion-button>

...

<!-- [src] es property binding de Angular: enlaza la imagen con la variable imagenUrl -->
<img class="imagen" [src]="imagenUrl" alt="Imagen aleatoria" />
